services:
  eegfaktura-postgresql:
    image: ghcr.io/eegfaktura/eegfaktura-postgresql:0.2.0
#    build: ../eegfaktura-postgresql-docker
    hostname: eegfaktura-postgresql
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD_FILE: "/run/secrets/eegfaktura-postgres-password"
      POSTGRES_DATABASE: "postgres"
      DB_USERNAME: "eegfaktura"
      DB_PASSWORD_FILE: "/run/secrets/eegfaktura-db-password"
      DB_DATABASE: "eegfaktura"
      KEYCLOAK_DB_USERNAME: "keycloak"
      KEYCLOAK_DB_PASSWORD_FILE: "/run/secrets/eegfaktura-keycloak-db-password"
      KEYCLOAK_DB_DATABASE: "keycloak"
      POSTGRES_INITDB_ARGS: "--locale=de_DE:UTF8"
    ports:
      - "${DEV_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-26432}:5432"
    volumes:
      - eegfaktura_postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: "pg_isready -h 127.0.0.1 -d $${DB_DATABASE} -U $${DB_USERNAME}"
      timeout: 10s
      start_period: 10s
      interval: 10s
      retries: 20
    secrets:
      - eegfaktura-postgres-password
      - eegfaktura-db-password
      - eegfaktura-keycloak-db-password
          
  eegfaktura-mosquitto:
    image: ghcr.io/eegfaktura/eegfaktura-mosquitto:latest
    hostname: eegfaktura-mosquitto
    command: /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - eegfaktura_mosquitto_data:/mosquitto/data
      - eegfaktura_mosquitto_log:/mosquitto/log


  eegfaktura-postfix:
    image: ghcr.io/eegfaktura/eegfaktura-postfix:latest
    hostname: eegfaktura-postfix
    environment:
      POSTFIX_RELAY_HOST: "${SMTP_HOST:-smtp.yourdomain.com}"
      POSTFIX_RELAY_PORT: "${SMTP_PORT:-587}"
      POSTFIX_RELAY_TLS: "${SMTP_TLS:-yes}"
      POSTFIX_RELAY_USER: "${SMTP_USER:-yoruser@yourdomain.com}"
      POSTFIX_RELAY_PASSWORD_FILE: "/run/secrets/eegfaktura-smtp-password"
      POSTFIX_RELAY_EMAIL: "${SMTP_EMAIL:-eegfaktura@yourdomain.com}"
      POSTFIX_HOSTNAME: "eegfaktura-postfix"
      POSTFIX_MYDOMAIN: "${SMTP_DOMAIN:-yourdomain.com}"
      POSTFIX_MYNETWORK: ""
      POSTFIX_DNS_1: "9.9.9.9"
      POSTFIX_DNS_2: "1.1.1.1"
    secrets:
      - eegfaktura-smtp-password

  # Einmalige Hilfsaufgabe vor dem Start: backend, energystore und filestore laufen nicht als
  # root, sondern als UID/GID 1000. Ein Docker-Volume gehoert aber root, wenn es von einem
  # aelteren (Root-)Image angelegt wurde oder das Image das Verzeichnis nicht selbst anlegt
  # (filestore, backend). Dann koennte der Dienst nicht schreiben. Die Aufgabe stellt die
  # Volumes einmalig auf 1000:1000 um -- nur wenn die Wurzel noch nicht passt, damit nicht
  # bei jedem Start Millionen Dateien angefasst werden. (In Kubernetes erledigt das fsGroup.)
  eegfaktura-volume-permissions:
    image: busybox:1.37
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - |
        for d in /volumes/backend /volumes/energystore /volumes/filestore; do
          if [ "$$(stat -c %u:%g "$$d")" != "1000:1000" ]; then
            echo "$$d -> 1000:1000"
            chown -R 1000:1000 "$$d"
          fi
        done
    volumes:
      - eegfaktura_backend_data:/volumes/backend
      - eegfaktura_energystore_data:/volumes/energystore
      - eegfaktura_filestore_data:/volumes/filestore

  eegfaktura-energystore:
    image: ghcr.io/eegfaktura/eegfaktura-energystore:v1.5.2
    entrypoint: ["/bin/sh", "/opt/eegfaktura-entrypoint/url-poller.sh"]
    command: ["energystore", "-configPath", "/etc/energystore/", "-logtostderr=true", "-stderrthreshold=INFO"]
    hostname: eegfaktura-energystore
    environment:
      WAIT_URL: "${KEYCLOAK_URL:-http://eegfaktura-keycloak:8080}/realms/EEGFaktura/.well-known/openid-configuration"
      KEYCLOAK_CONFIG: "/run/secrets/eegfaktura-keycloak-json"
      ENERGYSTORE_MQTT_HOST: "tcp://eegfaktura-mosquitto:1883"
      ENERGYSTORE_SERVICES_master-server: "eegfaktura-backend:9092"
      ENERGYSTORE_PERSISTENCE_PATH: "/opt/rawdata"
    volumes:
      - ./entrypoints/url-poller.sh:/opt/eegfaktura-entrypoint/url-poller.sh:ro
      - eegfaktura_energystore_data:/opt/rawdata
    depends_on:
      eegfaktura-volume-permissions:
        condition: service_completed_successfully
      eegfaktura-mosquitto:
        condition: service_started
      eegfaktura-keycloak:
        condition: service_healthy        
    secrets:
      - eegfaktura-keycloak-json
      
  eegfaktura-web:
    image: ghcr.io/eegfaktura/vfeeg-web:v1.0.13
    hostname: eegfaktura-web
    environment:
      # Das Image rendert /config/keycloak-config.json aus einem Caddy-Template mit diesen
      # Env-Werten (ohne sie faellt es auf http://localhost:7080 zurueck -> #25). Ein Mount
      # unter den Webroot greift NICHT, da Caddy /config/... aus /srv serviert.
      # KEYCLOAK_URL = Unified-Hostname, der aus Browser UND Containern identisch aufloest
      # (Browser: "127.0.0.1 eegfaktura-keycloak" in die hosts-Datei) -> Token-iss == JWKS-URL.
      KEYCLOAK_URL: "${KEYCLOAK_URL:-http://eegfaktura-keycloak:8080}"
      KEYCLOAK_REALM: "EEGFaktura"
      KEYCLOAK_CLIENT_ID: "at.ourproject.vfeeg.app"
    depends_on:
      - eegfaktura-backend
      - eegfaktura-energystore
#      - eegfaktura-billing
      - eegfaktura-filestore   
      
  eegfaktura-backend:
    image: ghcr.io/eegfaktura/vfeeg-backend:v1.1.4
    entrypoint: ["/bin/sh", "/opt/eegfaktura-entrypoint/url-poller.sh"]
    command: ["vfeeg-backend", "-configPath", "/etc/backend/"]
    hostname: eegfaktura-backend
    volumes:
      - ./entrypoints/url-poller.sh:/opt/eegfaktura-entrypoint/url-poller.sh:ro
      - eegfaktura_backend_data:/opt/storage
      - ./eegfaktura-backend-config.yaml:/etc/backend/config.yaml
      - ./templates:/opt/storage/public/templates
    environment:
      WAIT_URL: "${KEYCLOAK_URL:-http://eegfaktura-keycloak:8080}/realms/EEGFaktura/.well-known/openid-configuration"
      WRAPPED_ENTRYPOINT: "/usr/local/bin/entrypoint.sh"
      KEYCLOAK_CONFIG: "/run/secrets/eegfaktura-keycloak-json"
      VFEEG_BACKEND_DATABASE_USER: "eegfaktura"
      VFEEG_BACKEND_DATABASE_PASSWORD: "${DATABASE_PASSWORD:-Dzy5lShLn1N3rqTM}"
      VFEEG_BACKEND_DATABASE_DBNAME: "eegfaktura"
      VFEEG_BACKEND_DATABASE_HOST: "eegfaktura-postgresql"
      VFEEG_BACKEND_DATABASE_PORT: "5432"
      VFEEG_BACKEND_MQTT_HOST: "tcp://eegfaktura-mosquitto:1883"     
    depends_on:
      eegfaktura-volume-permissions:
        condition: service_completed_successfully
      eegfaktura-postgresql:
        condition: service_healthy
      eegfaktura-mosquitto:
        condition: service_started
      eegfaktura-keycloak:
        condition: service_healthy
    secrets:
      - eegfaktura-keycloak-json
      
  eegfaktura-eda:
    image: ghcr.io/eegfaktura/eegfaktura-kep:v1.0.4
    hostname: eegfaktura-eda
    volumes:
      - eegfaktura_eda_data:/storage/prod 
      - ./eegfaktura-eda.application.conf:/conf/application.conf 
    depends_on:
      eegfaktura-postgresql:
        condition: service_healthy
      eegfaktura-mosquitto:
        condition: service_started
      eegfaktura-keycloak:
        condition: service_healthy

  eegfaktura-proxy:
    image: caddy:2.11.4
    ports: 
      - "${DEV_BIND_IP:-127.0.0.1}:${WEB_PORT:-8001}:80"
      - "${DEV_BIND_IP:-127.0.0.1}:${ADMIN_PORT:-8002}:81"
    volumes: 
      - ${CADDY_CONFIG_FILE:-./caddy/caddy.conf}:/etc/caddy/Caddyfile:ro
    depends_on:
      - eegfaktura-web
      - eegfaktura-backend
      - eegfaktura-energystore
#      - eegfaktura-billing
      - eegfaktura-filestore
      - eegfaktura-keycloak

  eegfaktura-keycloak:
    image: ghcr.io/eegfaktura/eegfaktura-keycloak:v1.0.2
    hostname: eegfaktura-keycloak
    command: start --optimized --import-realm
    volumes:
      - ${KEYCLOAK_IMPORT_DIR:-./keycloak/import}:/opt/keycloak/data/import:ro
    environment:
      KC_DB_USERNAME: "keycloak"
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:-Rs7naJnwoM4cz5Ws}"
      KC_DB_URL: "jdbc:postgresql://eegfaktura-postgresql:5432/keycloak"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
#      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: true
      PROXY_ADDRESS_FORWARDING: "true"
      KC_PROXY: edge
      KC_HOSTNAME_DEBUG: "true"
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-SuperSecretPassword}"
      # Unified Hostname: Keycloak ist unter EINEM Namen erreichbar, der von
      # Browser UND Containern identisch aufloest -> Token-iss == intern erreichbare
      # JWKS-URL. Browser-seitig dafuer "127.0.0.1 eegfaktura-keycloak" in die
      # hosts-Datei eintragen (Produktion: echte DNS-Domain statt hosts-Eintrag).
      KEYCLOAK_FRONTEND_URL: "${KEYCLOAK_URL:-http://eegfaktura-keycloak:8080}"
      KC_HTTP_MANAGEMENT_PORT: "9181"
    ports:
      - "${DEV_BIND_IP:-127.0.0.1}:${KEYCLOAK_PORT:-8080}:8080"
      - "${DEV_BIND_IP:-127.0.0.1}:${KEYCLOAK_MANAGEMENT_PORT:-9181}:9181"
    healthcheck:
      test: [
        "CMD-SHELL",
        "exec 3<>/dev/tcp/localhost/9181; \
        printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; \
        # Give the server a moment to respond, then search for 'UP'
        if timeout 3 cat <&3 | grep -m 1 'UP'; then \
          exec 3<&-; exec 3>&-; exit 0; \
        else \
          exec 3<&-; exec 3>&-; exit 1; \
        fi"
      ]
      start_period: 10s
      interval: 5s
      timeout: 2s
      retries: 20               
    depends_on:
      eegfaktura-postgresql:
        condition: service_healthy
        
  eegfaktura-admin-backend:
    image: ghcr.io/eegfaktura/eeg-registration-backend:v1.0.4
    hostname: eegfaktura-admin-backend
    command: /opt/docker/bin/eegfaktura-registration
    environment:
      KEYCLOAK_CONFIG_JSON: "/run/secrets/eegfaktura-keycloak-json"
      # Das admin-cli-Secret liest der Dienst AUSSCHLIESSLICH aus dieser Variablen
      # (application.conf: keycloak.secret = ${?KEYCLOAK_ADMIN_CLI_SECRET}); die
      # gemountete keycloak.json wird dafuer NICHT ausgewertet. Ohne die Variable
      # faellt er auf ein im Image eingebackenes Secret zurueck -> Keycloak
      # antwortet 401 und die EEG-Anlage schlaegt fehl. Der Wert muss mit
      # keycloak/import/realm-export.json (Client admin-cli) uebereinstimmen.
      KEYCLOAK_ADMIN_CLI_SECRET: "${KEYCLOAK_ADMIN_CLI_SECRET:-LOCALDEVONLYadminCliSecret123456}"
      # Token-Validierung (JWKS-Abruf + Issuer-Pruefung) laeuft ueber EINE URL.
      # Diese muss der Unified-Hostname sein, der vom Browser (Token-iss) UND aus
      # den Containern (JWKS) identisch erreichbar ist -> siehe eegfaktura-keycloak.
      KEYCLOAK_URL: "${KEYCLOAK_URL:-http://eegfaktura-keycloak:8080}"
      KEYCLOAK_REALM: "EEGFaktura"
      KEYCLOAK_AUDIENCE: "at.ourproject.vfeeg.admin"
      DATABASE_USER: "eegfaktura"
      DATABASE_PASSWORD: "${DATABASE_PASSWORD:-Dzy5lShLn1N3rqTM}"
      DATABASE_DBNAME: "eegfaktura"
      DATABASE_HOST: "eegfaktura-postgresql"
      DATABASE_PORT: "5432"
      REGISTER_SERVICE_HOST_EEG: "eegfaktura-backend"
      REGISTER_SERVICE_HOST_PONTON: "eegfaktura-eda"
    depends_on:
      eegfaktura-postgresql:
        condition: service_healthy
      eegfaktura-mosquitto:
        condition: service_started
      eegfaktura-keycloak:
        condition: service_healthy
    secrets:
      - eegfaktura-keycloak-json
              
  eegfaktura-admin-web:
    image: ghcr.io/eegfaktura/eeg-registration-frontend:v1.1.3
    hostname: eegfaktura-admin-web
    environment:
      # Wie eegfaktura-web: die Keycloak-URL kommt aus dem Env-Template des Images
      # (ohne sie -> http://localhost:7080, genau der Fehler aus #25). Ein Mount unter
      # den Webroot greift NICHT (Caddy serviert /config/... aus /srv). Unified-Hostname,
      # Browser braucht den hosts-Eintrag "127.0.0.1 eegfaktura-keycloak".
      KEYCLOAK_URL: "${KEYCLOAK_URL:-http://eegfaktura-keycloak:8080}"
      KEYCLOAK_REALM: "EEGFaktura"
      KEYCLOAK_CLIENT_ID: "at.ourproject.vfeeg.admin"
    depends_on:
      eegfaktura-postgresql:
        condition: service_healthy
      eegfaktura-mosquitto:
        condition: service_started
      eegfaktura-keycloak:
        condition: service_healthy

  eegfaktura-filestore:
    image: ghcr.io/eegfaktura/eegfaktura-filestore:v1.0.4
    hostname: eegfaktura-filestore
    volumes:
      - eegfaktura_filestore_data:/eegfaktura-filestore-data
    environment:
      DB_HOSTNAME: "eegfaktura-postgresql"
      DB_USERNAME: "eegfaktura"
      DB_PASSWORD_FILE: "/run/secrets/eegfaktura-db-password"
      HTTP_PROTOCOL: "http"
      HTTP_HOSTNAME: "0.0.0.0"
      HTTP_PORT: 8080
      HTTP_FILE_DL_ENDPOINT: "filestore"
      JWT_PUBLIC_KEY_FILE: "/run/secrets/eegfaktura-jwt-public-key"
      FILESTORE_LOCAL_BASE_DIR: "/eegfaktura-filestore-data"
      # Werte als String quoten: aeltere docker-compose-Versionen (z.B. v1.29.2 auf
      # Debian 12) lehnen unquoted Booleans als Env-Wert ab ("invalid type").
      # ACHTUNG: aktiviert Auto-Anlage von Category/Container/Storage — fuer den
      # First-Run-Komfort dieses Stacks gewollt, aber in Produktion abzuschalten.
      # Deaktivieren NICHT ueber "false" (der filestore wertet jeden nicht-leeren
      # String als true), sondern ueber einen leeren Wert ("").
      FILESTORE_CREATE_UNKNOWN_CATEGORY: "true"
      FILESTORE_CREATE_UNKNOWN_CONTAINER: "true"
      FILESTORE_CREATE_UNKNOWN_STORAGE: "true"
    depends_on:
      eegfaktura-volume-permissions:
        condition: service_completed_successfully
      eegfaktura-postgresql:
        condition: service_healthy
    secrets:
      - eegfaktura-db-password
      - eegfaktura-jwt-public-key

  eegfaktura-billing:
    image: ghcr.io/eegfaktura/eegfaktura-billing:v1.0.5
    hostname: eegfaktura-billing
    environment:
      JDBC_DATABASE_URL: "jdbc:postgresql://eegfaktura-postgresql:5432/eegfaktura"
      JDBC_DATABASE_USERNAME: "eegfaktura"
      JDBC_DATABASE_PASSWORD: "${DATABASE_PASSWORD:-Dzy5lShLn1N3rqTM}"
      # Pflicht: application.properties hat fuer diese vier KEINEN Default
      # (spring.mail.host=${MAIL_HOST} usw.). Fehlen sie, scheitert der Start mit
      # "Could not resolve placeholder 'MAIL_HOST'" -- der Dienst kam im Compose-Stack
      # also nie hoch, obwohl depends_on auf postfix schon vorhanden war.
      MAIL_HOST: "eegfaktura-postfix"
      MAIL_PORT: "25"
      MAIL_USER: " "
      MAIL_PASSWORD: ""
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS_ENABLE: "false"
      # Ohne diese Variable greift der Default aus application.properties,
      # /billing/zertifikat-pub.pem -- ein Pfad, den es im Image NICHT gibt (dort liegt
      # nur /opt/app/eegfaktura-billing.jar). getRSAPublicKey() wirft dann, die Exception
      # wird geschluckt und die Authentifizierung bleibt leer: JEDER /cash/*-Aufruf
      # scheitert. Der Key wird pro Request gelesen, ein Neustart nach dem Austausch ist
      # also nicht noetig.
      JWT_PUBLICKEYFILE: "/run/secrets/eegfaktura-jwt-public-key"
    depends_on:
      eegfaktura-postgresql:
        condition: service_healthy
      eegfaktura-postfix:
        condition: service_started
    secrets:
      - eegfaktura-jwt-public-key
      
volumes:
    eegfaktura_postgres_data:
    eegfaktura_mosquitto_data:
    eegfaktura_mosquitto_log:
    eegfaktura_energystore_data:
    eegfaktura_eda_data:
    eegfaktura_backend_data:
    eegfaktura_filestore_data:

secrets:
  eegfaktura-postgres-password:
    file: "${POSTGRES_PASSWORD_FILE:-./eegfaktura-postgres-password.txt}"
  eegfaktura-db-password:
      file: "${DATABASE_PASSWORD_FILE:-./eegfaktura-db-password.txt}"
  eegfaktura-jwt-public-key:
    file: "${JWT_PUBLIC_KEY_FILE:-./jwt-public-key.pem}"
  eegfaktura-https-key:
    file: ./eegfaktura-proxy.key
  eegfaktura-https-cert:
    file: ./eegfaktura-proxy.crt
  eegfaktura-smtp-password:
      file: "${SMTP_PASSWORD_FILE:-./eegfaktura-smtp-password.txt}"
  eegfaktura-keycloak-db-password:
      file: "${KEYCLOAK_DB_PASSWORD_FILE:-./eegfaktura-keycloak-db-password.txt}"
  eegfaktura-keycloak-json:
      file: "${KEYCLOAK_CONFIG_FILE:-./keycloak/keycloak.json}"
