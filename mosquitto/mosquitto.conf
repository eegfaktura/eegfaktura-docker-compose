# Wie im Image ghcr.io/eegfaktura/eegfaktura-mosquitto (Listener, Persistenz, Log), dazu die Limits der Produktion:
# energystore bestaetigt Nachrichten seit 1.8.0 selbst (manual ack). Mit den Standardwerten (20 in flight,
# 1000 in der Warteschlange je Client) verwirft mosquitto bei grossen Energiedaten-Anforderungen still Nachrichten.
user mosquitto

listener 1883
protocol mqtt

listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data

allow_anonymous true
log_dest file /mosquitto/log/mosquitto.log

max_inflight_messages 1000
max_queued_messages 100000
max_queued_bytes 629145600
