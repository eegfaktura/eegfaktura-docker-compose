app {
    interface.mode = "PROD"
    kepserver {
      url = "http://localhost:6060/ponton/eda/webservice/outbound"
    }
    supervise-type = MAIL
    server {
      host = "localhost"
      port = 6090
    }
    grpc {
        port = 9093
        host = "0.0.0.0"
    }
}

epmsmail {
    mail {
        inbox = "/storage/prod/inbox"
        edanet.at {
            interval = 60 minutes
            javaxmail {
                mail {
                    store.protocol = "imap"
                    imap {
                        starttls.enable = true
                    }
                    smtp {
                        starttls.enable = true
                        auth = true
                    }
                }
            }
        }
        gmail.com {
            interval = 60 minutes
            javaxmail {
                mail {
                    store.protocol = "imap"
                    imap {
                        ssl.enable = true
                        host = "imap.gmail.com"
                        starttls.enable = true
                    }
                    smtp {
                        host = "smtp.gmail.com"
                        starttls.enable = true
                        auth = true
                    }
                }
            }
        }
    }
    mqtt {
        host = "eegfaktura-mosquitto"
        port = 1883
        sub-topic = "eda/request"
        qos = 1
        consumer-id = "xpadapter-client"
        topics {
            errorTopic = "eda/response/error"
        }
    }

    # Mails an Mitglieder (Freigabe-Aufforderung, Zaehlpunkt aktiv/inaktiv) und der Energiedaten-Bericht gehen wie bei
    # billing ueber den postfix-Relay im Stack; der Relay ist im internen Netz ohne STARTTLS und Anmeldung erreichbar
    # und reicht an den SMTP des Betreibers weiter (SMTP_HOST usw. in der .env). Absender: EMAIL_ADMIN_FROM (= SMTP_EMAIL, docker-compose.yaml).
    admin {
        javaxmail {
            mail {
                smtp {
                    host = "eegfaktura-postfix"
                    port = 25
                    starttls.enable = false
                    auth = false
                }
            }
        }
    }
}

slick.pgsql.local {
  profile = "slick.jdbc.PostgresProfile$"
  db {
    driver="org.postgresql.Driver"
    url="jdbc:postgresql://eegfaktura-postgresql:5432/eegfaktura"
    user="eegfaktura"
    password="Dzy5lShLn1N3rqTM"
    password=${?DATABASE_PASSWORD}
    queueSize=5000
    connectionTimeout=30000
    # pool size: eda's built-in default (24/6/24 since v1.5.0, one pool for the whole process)
  }
}

flyway {
  url = ${slick.pgsql.local.db.url}
  user = ${slick.pgsql.local.db.user}
  password = ${slick.pgsql.local.db.password}
  locations = ["classpath:db/migration"]
}

logger.scala.slick.jdbc.JdbcBackend.statement=INFO
logging.level.com.zaxxer.hikari.HikariConfig=INFO
logging.level.com.zaxxer.hikari=INFO

# Persistence-Plugin/Serializer/http2/Logging kommen aus dem gebackenen reference.conf
# (pekko-Namespace). Hier wird NUR der Journal-/Snapshot-Pfad auf das absolute PVC
# /storage/prod überschrieben — reference.conf nutzt einen relativen Default, der im
# Container-Workdir /opt/docker nicht schreibbar ist.
# (Stand früher fälschlich unter akka{} → von Pekko ignoriert → env-Persistence lief
#  nie; auf pekko{} korrigiert 2026-07-12. Prod setzte denselben Pfad schon korrekt.)
pekko {
  persistence.journal.leveldb.dir = "/storage/prod/journal"
  persistence.snapshot-store.local.dir = "/storage/prod/snapshots"
}
